[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-agent-workspace"
version = "0.1.0"
description = "Self-hosted Markdown reader with anchored agent discussions and a tmux-backed remote terminal."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "watchfiles>=0.22",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
]

[project.scripts]
wiki-agent-workspace = "backend.app.cli:main"

[tool.setuptools]
packages = ["backend", "backend.app", "backend.app.agents", "backend.app.terminal", "backend.migrations", "backend.migrations.versions"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
