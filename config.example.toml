# Wiki Agent Workspace configuration. Default location: ~/.config/wiki-agent-workspace/config.toml (mode 0600).
# scripts/setup.sh writes this file for you; edit afterwards and restart scripts/start.sh.

[server]
bind = "127.0.0.1"          # loopback by default; expose only through a VPN/tunnel or an authenticated HTTPS reverse proxy
port = 8765
state_dir = "~/.local/share/wiki-agent-workspace"   # SQLite DB, snapshots, tmux config (outside the Git checkout)
cookie_secure = false       # set true when served over HTTPS
allowed_origins = []        # extra browser origins, e.g. ["https://wiki.example.internal"]
trusted_proxies = []        # proxies whose X-Forwarded-* headers are trusted, e.g. ["127.0.0.1"]
gateway_auth = false        # true only behind an already-authenticated gateway that sets gateway_user_header
gateway_user_header = ""    # e.g. "X-Forwarded-User"; requests from trusted_proxies with this header skip the token login
session_days = 30
log_level = "INFO"
frontend_dist = ""          # built UI directory; empty = <repo>/frontend/dist

[workspace]
root = "/home/me/my-wiki"   # primary wiki folder (may be a Git worktree); more folders: [[workspaces]] below or "＋ Add folder" in the UI
max_document_bytes = 20971520

# Additional wiki folders opened in the same window (each fully isolated). Optional; folders can also be added in the UI.
# [[workspaces]]
# root = "/home/me/notes-wiki"
# name = "Notes"

[terminal]
tmux_history_limit = 10000  # lines retained per pane in the app-owned tmux server
shell = ""                  # shell for new terminals; empty = $SHELL

[auth]
# Generated by setup; never printed by the server. Alternatively supply WAW_ACCESS_TOKEN in the environment.
access_token = ""
server_secret = ""

[agents]
default_provider = "opencode"   # or "codex"; detected automatically at setup when empty

[agents.opencode]
enabled = true
mode = "cli"                 # "cli": `opencode run --format json`. "server": talk to a known `opencode serve` instance.
# server_url = "http://127.0.0.1:4096"   # for mode = "server": start `opencode serve --port 4096` once and attach your
#                                        # terminal TUI with `opencode --attach http://127.0.0.1:4096` so both share one backend
# bin = "/home/me/.opencode/bin/opencode"
# profile = "build"          # --agent name
extra_args = []

[agents.codex]
enabled = true
sandbox = "workspace-write"  # sandbox for app-driven turns (DESIGN §8); read-only | workspace-write | danger-full-access
# bin = "/home/me/.local/bin/codex"
# profile = "wiki"           # --profile name from ~/.codex/config.toml
extra_args = []
